<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Girişi | NLP Platformu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { width: 100%; max-width: 400px; padding: 2.5rem; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); background: rgba(255, 255, 255, 0.95); }
        .btn-custom { background: linear-gradient(to right, #2b5876, #4e4376); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; }
        .btn-custom:hover { color: white; opacity: 0.9; transform: translateY(-2px); transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <h4 class="fw-bold" style="color: #2b5876;"><i class="bi bi-shield-lock-fill me-2"></i>Yönetici Girişi</h4>
            <p class="text-muted small">Yapay Zeka Paneline erişmek için giriş yapın.</p>
        </div>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-secondary fw-bold"><i class="bi bi-person-fill me-1"></i>Kullanıcı Adı</label>
                <input type="text" name="username" class="form-control bg-light" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary fw-bold"><i class="bi bi-key-fill me-1"></i>Şifre</label>
                <input type="password" name="password" class="form-control bg-light" required>
            </div>
            <button type="submit" class="btn btn-custom w-100"><i class="bi bi-box-arrow-in-right me-2"></i>Sisteme Giriş Yap</button>
        </form>
        {% if form.errors %}
            <div class="alert alert-danger mt-3 py-2 text-center" style="border-radius: 8px;" role="alert">Hatalı giriş yaptınız.</div>
        {% endif %}
    </div>
    
    <div class="text-center mt-4 text-white-50 small">
        Samsun Üniversitesi<br>
        <strong>Geliştirici: Ömer Faruk Özcan</strong>
    </div>
</body>
</html>
